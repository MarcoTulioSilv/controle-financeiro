version: 2
# cooldown: espera 7 dias depois da publicação de uma versão antes de propor a atualização.
# Versões recém-publicadas são as mais usadas em ataques à cadeia de suprimentos (pacote
# sequestrado e removido dias depois). Não atrasa as atualizações de segurança.
updates:
  - package-ecosystem: maven
    directory: /core
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
    # Os tipos acompanham a versão do Node em execução (engines no package.json).
    # A troca de versão maior do Node é uma decisão de projeto: engines, pipeline,
    # imagem Docker e tipos mudam juntos, num PR próprio.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]