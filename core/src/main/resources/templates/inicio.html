<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início · Controle Financeiro</title>
</head>
<body>
<main>
    <h1>Controle Financeiro</h1>
    <p>Conectado como <strong th:text="${login}">login</strong>.</p>

    <!-- Sair é um POST (com o token CSRF), para que um link em outro site não desconecte ninguém. -->
    <form th:action="@{/logout}" method="post">
        <button type="submit">Sair</button>
    </form>
</main>
</body>
</html>
