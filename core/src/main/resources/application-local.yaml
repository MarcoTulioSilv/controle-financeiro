# Perfil "local": aplicação rodando no notebook, fora do Docker, acessando o MySQL
# publicado pelo docker-compose em 127.0.0.1:3307.
#
# Ativar com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE}?connectionTimeZone=UTC
